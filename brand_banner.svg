<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="100%">
  <defs>
    <!-- State A Gradient: Deep Emerald Teal to Glacier Mint -->
    <linearGradient id="gradA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- State B Gradient: Ice Blue/Cyan to Glacier Mint -->
    <linearGradient id="gradB" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Legibility Shadow Filter for Dark/Light Mode Adaptability -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Main Animation Container with Global Legibility Shadow -->
  <g filter="url(#softShadow)">
    
    <!-- ========================================== -->
    <!-- SWAYING BRAND LOGO MARK (X=200, Y=150)     -->
    <!-- ========================================== -->
    <g transform="translate(180, 150)">
      <g>
        <!-- Dynamic Organic Wind Swaying Animation -->
        <animateTransform attributeName="transform" type="rotate"
          values="-6; 6; -6" dur="6s" repeatCount="indefinite"
          calcMode="spline" keyTimes="0; 0.5; 1" keySplines="0.4, 0, 0.2, 1; 0.4, 0, 0.2, 1" />
        
        <!-- Rotating Outer Dotted Compass/Rhythm Ring -->
        <circle cx="0" cy="0" r="42" fill="none" stroke="url(#gradA)" stroke-width="2" stroke-dasharray="3 6" opacity="0.3">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite" />
        </circle>
        
        <!-- Rotating Mid Solid Ring -->
        <circle cx="0" cy="0" r="35" fill="none" stroke="url(#gradB)" stroke-width="1.5" stroke-dasharray="20 10" opacity="0.5">
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="18s" repeatCount="indefinite" />
        </circle>

        <!-- Dynamic EQ Columns Representing Sound Workstation -->
        <g transform="translate(0, 0)">
          <!-- Bar 1 (Left Outer) -->
          <rect x="-18" y="-8" width="5" height="16" rx="2.5" fill="url(#gradA)" opacity="0.7">
            <animate attributeName="height" values="16; 32; 16" dur="2s" repeatCount="indefinite" />
            <animate attributeName="y" values="-8; -16; -8" dur="2s" repeatCount="indefinite" />
          </rect>
          
          <!-- Bar 2 (Left Inner) -->
          <rect x="-10" y="-18" width="5" height="36" rx="2.5" fill="url(#gradA)" opacity="0.9">
            <animate attributeName="height" values="36; 18; 36" dur="1.7s" repeatCount="indefinite" />
            <animate attributeName="y" values="-18; -9; -18" dur="1.7s" repeatCount="indefinite" />
          </rect>
          
          <!-- Bar 3 (Center Peak) -->
          <rect x="-2" y="-25" width="5" height="50" rx="2.5" fill="url(#gradA)">
            <animate attributeName="height" values="50; 24; 50" dur="1.3s" repeatCount="indefinite" />
            <animate attributeName="y" values="-25; -12; -25" dur="1.3s" repeatCount="indefinite" />
          </rect>
          
          <!-- Bar 4 (Right Inner) -->
          <rect x="6" y="-15" width="5" height="30" rx="2.5" fill="url(#gradB)" opacity="0.9">
            <animate attributeName="height" values="30; 48; 30" dur="1.5s" repeatCount="indefinite" />
            <animate attributeName="y" values="-15; -24; -15" dur="1.5s" repeatCount="indefinite" />
          </rect>
          
          <!-- Bar 5 (Right Outer) -->
          <rect x="14" y="-6" width="5" height="12" rx="2.5" fill="url(#gradB)" opacity="0.7">
            <animate attributeName="height" values="12; 24; 12" dur="2.2s" repeatCount="indefinite" />
            <animate attributeName="y" values="-6; -12; -6" dur="2.2s" repeatCount="indefinite" />
          </rect>
        </g>
      </g>
    </g>

    <!-- ========================================== -->
    <!-- STATE A: "Voluma" (Emerald-to-Mint)        -->
    <!-- ========================================== -->
    <g>
      <!-- Vertical Rolling Cylinder Translation Loop -->
      <animateTransform attributeName="transform" type="translate"
        values="0 40; 0 0; 0 0; 0 -40; 0 -40; 0 40"
        dur="8s" repeatCount="indefinite"
        calcMode="spline" keyTimes="0; 0.05; 0.375; 0.5; 0.875; 1"
        keySplines="0.4, 0, 0.2, 1; 0.4, 0, 0.2, 1; 0.4, 0, 0.2, 1; 0.4, 0, 0.2, 1; 0.4, 0, 0.2, 1" />
      
      <text x="260" y="176" 
            font-family="'Orbitron', 'Inter', -apple-system, sans-serif" 
            font-size="82" 
            font-weight="900" 
            letter-spacing="16" 
            fill="url(#gradA)">
        VOLUMA
        <!-- Synchronized Opacity Fade Loop -->
        <animate attributeName="opacity"
          values="0; 1; 1; 0; 0; 0"
          dur="8s" repeatCount="indefinite"
          calcMode="spline" keyTimes="0; 0.05; 0.375; 0.5; 0.875; 1"
          keySplines="0.4, 0, 0.2, 1; 0.4, 0, 0.2, 1; 0.4, 0, 0.2, 1; 0.4, 0, 0.2, 1; 0.4, 0, 0.2, 1" />
      </text>
    </g>

    <!-- ========================================== -->
    <!-- STATE B: "Sound Editor" (Cyan-to-Mint)     -->
    <!-- ========================================== -->
    <g>
      <!-- Opposing Vertical Rolling Cylinder Translation Loop -->
      <animateTransform attributeName="transform" type="translate"
        values="0 -40; 0 40; 0 40; 0 0; 0 0; 0 -40"
        dur="8s" repeatCount="indefinite"
        calcMode="spline" keyTimes="0; 0.05; 0.375; 0.5; 0.875; 1"
        keySplines="0.4, 0, 0.2, 1; 0.4, 0, 0.2, 1; 0.4, 0, 0.2, 1; 0.4, 0, 0.2, 1; 0.4, 0, 0.2, 1" />
      
      <text x="260" y="174" 
            font-family="'Orbitron', 'Inter', -apple-system, sans-serif" 
            font-size="64" 
            font-weight="900" 
            letter-spacing="6" 
            fill="url(#gradB)">
        SOUND EDITOR
        <!-- Synchronized Opacity Fade Loop -->
        <animate attributeName="opacity"
          values="0; 0; 0; 1; 1; 0"
          dur="8s" repeatCount="indefinite"
          calcMode="spline" keyTimes="0; 0.05; 0.375; 0.5; 0.875; 1"
          keySplines="0.4, 0, 0.2, 1; 0.4, 0, 0.2, 1; 0.4, 0, 0.2, 1; 0.4, 0, 0.2, 1; 0.4, 0, 0.2, 1" />
      </text>
    </g>

  </g>
</svg>
